<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;550;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <span class="brand"><span class="diamond" aria-hidden="true">◇</span> lode</span>
  <button id="toggle-tree" class="faint" type="button">files</button>
  <button id="open-entries" class="faint" type="button" title="Where to start reading">entry points</button>
  <button id="open-explain" class="faint" type="button" title="Ask about the flow's cards, or to show more (i)">explain</button>
  <span id="project" class="faint"></span>
  <div class="search">
    <label for="search" class="faint">find</label>
    <input id="search" type="search" placeholder="symbol name, or / to ask…" autocomplete="off" title="A symbol's name, or / and a question: / how do we create tabs?">
    <ul id="results" role="listbox" hidden></ul>
  </div>
</header>
<main class="body">
  <aside id="side">
    <header class="side-bar">
      <button id="side-files" class="side-mode" aria-selected="true" title="Files">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="side-name"></span>
      </button>
      <button id="side-changes" class="side-mode" aria-selected="false" title="Changes since a git ref">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 8.2v7.6"/><path d="M17 11.2c0 3-2.4 4.6-5.6 5.1"/></svg>
        <span id="changes-count"></span>
      </button>
    </header>
    <nav id="tree" aria-label="Files"></nav>
    <div id="changes" aria-label="Changes" hidden>
      <div class="changes-bar">
        <label class="faint" for="changes-base">since</label>
        <input id="changes-base" value="HEAD" spellcheck="false" autocomplete="off" title="A git ref: HEAD (uncommitted), main, HEAD~3, a commit">
        <button id="changes-all" title="Open every changed symbol in a new flow">open all</button>
      </div>
      <div id="changes-totals" class="faint"></div>
      <div id="changes-list"></div>
    </div>
  </aside>
  <div id="side-resize" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" title="Drag to resize"></div>
  <section class="views" aria-label="lode views">
    <div id="tabs" role="tablist"></div>
    <div class="stage">
      <div id="view"></div>
      <aside id="explain" aria-label="Explain" hidden></aside>
    </div>
  </section>
</main>
<footer id="status" class="faint"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
